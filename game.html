<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معركة شطرنج النخبة</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="style-levels.css">
</head>
<body class="dark-theme">

    <button class="bottom-left-settings" onclick="openSettings()" title="الإعدادات">⚙️</button>

    <div class="game-container">
        
        <div class="matchup-header">
            <div class="enemy-display">
                <div class="avatar-box"><img id="enemy-img" src="images/1.jpg" alt="" class="char-avatar"></div>
                <div>
                    <h3 id="enemy-name" style="margin:0 0 5px 0;">الخصم</h3>
                    <span class="level-num" id="enemy-level">Lv. --</span>
                </div>
            </div>

            <div class="vs-badge">معركة ذكاء استراتيجي</div>
        </div>

        <div class="chessboard-area" id="chessboard"></div>

        <div class="control-bar">
            <button class="game-btn" onclick="undoMove()">تراجع ⟲</button>
            <button class="game-btn" onclick="restartGame()">إعادة المعركة 🔄</button>
            <button class="game-btn" onclick="goBackToLevels()">العودة للمستويات 🏠</button>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            var randomBg = Math.floor(Math.random() * 3) + 1;
            document.body.style.backgroundImage = `linear-gradient(rgba(7, 9, 14, 0.85), rgba(7, 9, 14, 0.85)), url('images/${randomBg}.jfif')`;

            const urlParams = new URLSearchParams(window.location.search);
            const lvl = urlParams.get('level') || 1;
            updateEnemyInfo(lvl);
            buildChessBoard();
        });

        function updateEnemyInfo(lvl) {
            const characters = [
                { name: "هونامي إيتشينوسي", level: "Lv. 100", img: "images/1.jpg" },
                { name: "سوزوني هوريكيتا", level: "Lv. 300", img: "images/2.jpg" },
                { name: "كاكيرو ريون", level: "Lv. 600", img: "images/3.jpg" },
                { name: "ميابي ناجومو", level: "Lv. 1000", img: "images/4.jpg" },
                { name: "كوهي كاتسوراغي", level: "Lv. 1400", img: "images/5.jpg" },
                { name: "مانابو هوريكيتا", level: "Lv. 1800", img: "images/6.jpg" },
                { name: "إيكا أماساوا", level: "Lv. 2200", img: "images/7.jpg" },
                { name: "تاكويا ياغامي", level: "Lv. 2600", img: "images/8.jpg" },
                { name: "روين كوانجي", level: "Lv. 2900", img: "images/9.jpg" },
                { name: "أريسو ساكاياناغي", level: "Lv. 3200", img: "images/10.jpg" },
                { name: "كيوتكا أيانوكوجي", level: "Lv. ????", img: "images/ayanokoji.png" }
            ];

            let index = parseInt(lvl) - 1;
            if(index >= 0 && index < characters.length) {
                document.getElementById('enemy-name').innerText = characters[index].name;
                document.getElementById('enemy-level').innerText = characters[index].level;
                document.getElementById('enemy-img').src = characters[index].img;
            }
        }

        function buildChessBoard() {
            const board = document.getElementById('chessboard');
            board.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `chess-square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    square.onclick = function() {
                        document.querySelectorAll('.move-dot').forEach(d => d.remove());
                        const dot = document.createElement('div');
                        dot.className = 'move-dot';
                        square.appendChild(dot);
                    };

                    board.appendChild(square);
                }
            }
        }

        function undoMove() { alert("تم التراجع."); }
        function restartGame() { buildChessBoard(); }
        function goBackToLevels() { window.location.href = 'index.html'; }
        function openSettings() { alert("الإعدادات متاحة في صفحة المستويات الرئيسية."); }
    </script>
</body>
</html>
