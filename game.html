<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معركة شطرنج النخبة</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبات الشطرنج الأساسية لضمان ظهور الرقعة والقطع -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
</head>
<body class="dark-theme">

    <button class="bottom-left-settings" onclick="goBackToLevels()"></button>

    <div class="game-container">
        
        <div class="matchup-header">
            <div class="enemy-profile">
                <div class="avatar-box"><img id="enemy-img" src="" class="char-avatar"></div>
                <div>
                    <h3 id="enemy-name" style="margin:0 0 5px 0; color:#fff;">الخصم</h3>
                    <span class="level-num" id="enemy-level">Lv. --</span>
                </div>
            </div>
            <div style="color:var(--neon-yellow); font-weight:bold;">معركة</div>
        </div>

        <div class="status-box" id="status">جاري التحميل...</div>

        <!-- رقعة الشطرنج الحقيقية -->
        <div id="board"></div>

        <div class="control-bar">
            <button class="icon-btn restart-icon" onclick="restartGame()" title="إعادة المستوى"></button>
            <button class="icon-btn hint-icon" onclick="toggleShowMoves()" title="إظهار الحركات"></button>
        </div>

    </div>

    <div id="gameOverModal" class="game-over-modal">
        <div class="modal-content">
            <h2 id="winnerText" style="color:var(--neon-yellow)">نتيجة المعركة</h2>
            <button style="background:var(--neon-orange); color:#000; border:none; padding:10px 20px; font-weight:bold; border-radius:6px; cursor:pointer; margin-top:15px;" onclick="restartMatch()">إعادة</button>
        </div>
    </div>

    <!-- جافاسكريبت المكتبات المطلوبة لرسم الرقعة -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
