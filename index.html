<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">شطرنج Ayanokoji</title>
    
    <!-- أيقونة تبويب المتصفح -->
    <link rel="icon" href="images/favicon.png" type="image/png">

    <link rel="stylesheet" href="style.css">
    <!-- مكتبة الرقعة التي حملتها -->
    <link rel="stylesheet" href="css/chessboard-1.0.0.min.css">
</head>
<body class="dark-theme">

    <!-- إعدادات المظهر واللغة (في الجزء الأيسر بالأسفل) -->
    <div class="settings-panel">
        <button id="themeToggle" class="setting-btn" title="تغيير المظهر">🌓</button>
        <select id="langSelect" class="setting-btn">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <div class="main-container">
        
        <!-- بروفايل الخصم: أيانوكوجي (في الأعلى مع العبارة الأسطورية) -->
        <div class="profile-card opponent-card">
            <div class="avatar-container">
                <img src="images/ayanokoji.png" alt="Ayanokoji" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="profile-info">
                <h3 id="ayanokojiName">أيانوكوجي كيوتاكا</h3>
                <span class="sub-text quote-text" id="ayanokojiRole">"في هذا العالم، الفوز هو كل شيء؛ لا تهم الطريقة، ولا يهم من يجب التضحية به، طالما أنني أفوز في النهاية، فهذا هو الأهم"</span>
            </div>
        </div>

        <!-- رقعة الشطرنج في المنتصف -->
        <div class="board-wrapper">
            <div id="board" style="width: 380px;"></div>
            <div class="game-controls">
                <button id="startBtn" class="action-btn">لعبة جديدة</button>
                <span id="status">الحالة: جاهز</span>
            </div>
        </div>

        <!-- بروفايل اللاعب: YOU (في الأسفل - بدون عبارة اللاعب الأبيض) -->
        <div class="profile-card player-card">
            <div class="avatar-container">
                <img src="images/player.png" alt="YOU" class="avatar">
                <div class="status-dot online"></div>
            </div>
            <div class="profile-info">
                <h3 id="playerName">YOU (أنت)</h3>
            </div>
        </div>

    </div>

    <!-- المكتبات البرمجية -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="js/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
