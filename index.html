<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">شطرنج Ayanokoji - المستوى الأسطوري</title>
    
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/chessboard-1.0.0.min.css">
</head>
<body class="dark-theme">

    <!-- شاشة البداية لاختيار اللون -->
    <div id="startScreen" class="start-screen">
        <div class="start-box">
            <h2>شطرنج كيوتاكا أيانوكوجي</h2>
            <p>اختر لون القطع لمواجهة العبقري:</p>
            <div class="color-selection">
                <button class="color-btn white-choice" onclick="startGame('white')">⚪ الأبيض (تبدأ أولاً)</button>
                <button class="color-btn black-choice" onclick="startGame('black')">⚫ الأسود (أيانوكوجي يبدأ)</button>
            </div>
        </div>
    </div>

    <!-- نافذة كش مات الفخمة -->
    <div id="gameOverModal" class="game-over-modal" style="display: none;">
        <div class="modal-box">
            <h2 id="winnerTitle">انتهت اللعبة</h2>
            <p id="winnerText"></p>
            <button class="action-btn" onclick="restartToMenu()">لعبة جديدة</button>
        </div>
    </div>

    <!-- لوحة الأزرار (مظهر، ملء شاشة، مساعدة) -->
    <div class="settings-panel">
        <button id="themeToggle" class="setting-btn" title="تغيير المظهر">🌓</button>
        <button id="fullscreenToggle" class="setting-btn" title="تكبير الشاشة">⛶</button>
        <button id="hintsToggle" class="setting-btn" title="إظهار/إخفاء الحركات">💡</button>
        <select id="langSelect" class="setting-btn">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <div class="main-container">
        
        <!-- بروفايل أيانوكوجي -->
        <div class="profile-card opponent-card">
            <div class="avatar-container">
                <img src="images/ayanokoji.png" alt="Ayanokoji" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="profile-info">
                <h3 id="ayanokojiName">أيانوكوجي كيوتاكا</h3>
                <span class="sub-text quote-text" id="ayanokojiRole">"في هذا العالم، الفوز هو كل شيء؛ لا تهم الطريقة، ولا يهم من يجب التضحية به، طالما أنني أفوز في النهاية، فهذا هو الأهم"</span>
                <div id="opponentCaptured" class="captured-pieces"></div>
            </div>
        </div>

        <!-- رقعة الشطرنج -->
        <div class="board-wrapper">
            <div id="board" style="width: 380px;"></div>
            <div class="game-controls">
                <button id="restartBtn" class="action-btn">القائمة الرئيسية</button>
                <span id="status">الحالة: جاهز</span>
            </div>
        </div>

        <!-- بروفايل اللاعب -->
        <div class="profile-card player-card">
            <div class="avatar-container">
                <img src="images/player.png" alt="YOU" class="avatar">
                <div class="status-dot online"></div>
            </div>
            <div class="profile-info">
                <h3 id="playerName">YOU (أنت)</h3>
                <div id="playerCaptured" class="captured-pieces"></div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="js/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
