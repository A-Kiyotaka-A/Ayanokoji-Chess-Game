<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج Ayanokoji - النسخة الأسطورية</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body class="dark-theme">

    <!-- شاشة البداية -->
    <div id="startScreen" class="start-screen" style="display: flex;">
        <div class="start-box">
            <h2>شطرنج كيوتاكا أيانوكوجي</h2>
            <p>اختر لون القطع لمواجهة العبقري المطلق:</p>
            <div class="color-selection">
                <button class="color-btn" onclick="startGame('white')">⚪ الأبيض</button>
                <button class="color-btn" onclick="startGame('black')">⚫ الأسود</button>
            </div>
        </div>
    </div>

    <!-- نافذة نهاية اللعبة -->
    <div id="gameOverModal" class="game-over-modal" style="display: none;">
        <div class="modal-box">
            <h2 id="winnerTitle">انتهت اللعبة</h2>
            <p id="winnerText"></p>
            <button class="action-btn legendary-btn" onclick="restartMatch()" style="width: 100%; margin-bottom: 10px;">إعادة المباراة</button>
            <button class="action-btn" onclick="resetToMenu()" style="width: 100%;">القائمة الرئيسية</button>
        </div>
    </div>

    <!-- 1. شريط الشعار العلوي -->
    <div class="top-banner">
        <span>Ayanokoji Chess Arena</span>
    </div>

    <!-- الحاوية الرئيسية (يسار: اللاعب | وسط: الرقعة | يمين: أيانوكوجي والأزرار) -->
    <div class="main-container">

        <!-- 2. بروفايل اللاعب (على اليسار) -->
        <div class="player-side-panel">
            <div class="avatar-container">
                <img src="images/player.png" alt="YOU" class="avatar">
            </div>
            <h3>اللاعب (أنت)</h3>
            <div id="playerCaptured" class="captured-pieces"></div>
        </div>

        <!-- 3. رقعة الشطرنج (في المنتصف) -->
        <div class="board-wrapper">
            <div id="board" style="width: 400px;"></div>
            <div class="game-controls">
                <span id="status">الحالة: جاهز</span>
                <button class="action-btn" onclick="resetToMenu()" style="padding: 5px 12px; font-size: 0.8rem;">القائمة</button>
            </div>
        </div>

        <!-- 4. الجانب الأيمن (عبوة أيانوكوجي فوق + علبة الأزرار تحتها) -->
        <div class="right-side-panel">
            <!-- بروفايل أيانوكوجي العمودي -->
            <div class="opponent-card">
                <div class="avatar-container">
                    <img src="images/ayanokoji.png" alt="Ayanokoji" class="avatar">
                </div>
                <h3>أيانوكوجي كيوتاكا</h3>
                <span class="quote-text">"البشر مجرد أدوات، والحسابات لا تخطئ."</span>
                <div id="opponentCaptured" class="captured-pieces"></div>
            </div>

            <!-- علبة الأزرار والتتبيثات -->
            <div class="settings-box">
                <button id="themeToggle" class="setting-btn">🌓 تبديل المظهر</button>
                <button id="fullscreenToggle" class="setting-btn">⛶ ملء الشاشة</button>
                <button id="hintsToggle" class="setting-btn">♟ إظهار الحركات</button>
                <button class="action-btn legendary-btn" onclick="restartMatch()">إعادة المباراة</button>
            </div>
        </div>

    </div>

    <!-- المكتبات الأساسية -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
