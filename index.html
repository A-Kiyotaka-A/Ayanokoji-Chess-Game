<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج Ayanokoji - النسخة النهائية</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <!-- شاشة البداية (تغطي كل شيء) -->
    <div id="startScreen" class="start-screen">
        <div class="start-box">
            <h2 class="neon-text">شطرنج كيوتاكا أيانوكوجي</h2>
            <p class="subtitle">الفوز هو كل شيء.. طالما أنني أفوز في النهاية.</p>
            <button class="play-trigger-btn" onclick="showColorSelection()">
                <div class="play-triangle"></div>
            </button>
            <div id="colorSelectionBox" class="color-selection" style="display: none;">
                <p class="neon-text-small">اختر لون القطع:</p>
                <button class="color-btn white-btn" onclick="startGame('white')">الأبيض</button>
                <button class="color-btn black-btn" onclick="startGame('black')">الأسود</button>
            </div>
        </div>
    </div>

    <!-- نافذة نهاية اللعبة -->
    <div id="gameOverModal" class="game-over-modal" style="display: none;">
        <div class="modal-box">
            <h2 class="neon-text">انتهت اللعبة</h2>
            <p id="winnerText" class="modal-text"></p>
            <button class="action-btn legendary-btn" onclick="resetToMenu()">العودة للقائمة</button>
        </div>
    </div>

    <!-- واجهة اللعب -->
    <div class="main-container">
        <div class="left-side-panel">
            <div class="opponent-card">
                <div class="avatar-container">
                    <img src="https://ui-avatars.com/api/?name=Ayanokoji&background=1e130c&color=f3c653&size=128" alt="Ayanokoji" class="avatar">
                </div>
                <h3>أيانوكوجي كيوتاكا</h3>
                <div class="captured-section">
                    <span class="captured-label">القطع المأخوذة</span>
                    <div id="opponentCaptured" class="captured-pieces"></div>
                </div>
            </div>
        </div>

        <div class="right-game-area">
            <div class="board-wrapper">
                <div id="board"></div>
                <div class="game-controls">
                    <span id="status" class="status-text">جاهز للبدء</span>
                </div>
            </div>
            <div class="tools-bar">
                <button id="hintsToggle" class="setting-btn active-hint">إظهار الحركات</button>
                <button class="action-btn legendary-btn" onclick="resetToMenu()">خروج</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
